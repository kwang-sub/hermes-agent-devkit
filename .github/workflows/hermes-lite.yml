name: Hermes Lite contract

on:
  push:
    branches: ["experiment/hermes-lite", "dev"]
    paths:
      - "AGENTS.md"
      - "shared/AGENTS.common.md"
      - "lite/**"
      - "updatekit_lite.*"
      - "scripts/lite_mode.py"
      - "scripts/test_lite_mode.py"
      - "scripts/check_lite_contract.py"
      - "scripts/test_lite_wrapper.ps1"
      - "custom-skills/lite/**"
      - "docs/*lite*"
      - ".github/workflows/hermes-lite.yml"
  pull_request:
    paths:
      - "AGENTS.md"
      - "shared/AGENTS.common.md"
      - "lite/**"
      - "updatekit_lite.*"
      - "scripts/lite_mode.py"
      - "scripts/test_lite_mode.py"
      - "scripts/check_lite_contract.py"
      - "custom-skills/lite/**"
      - "docs/*lite*"
      - ".github/workflows/hermes-lite.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lite-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install PyYAML
      - name: Lite adapter regression tests
        run: python scripts/test_lite_mode.py
      - name: Lite static contract
        run: python scripts/check_lite_contract.py
      - name: Validate Bash wrapper
        run: bash -n updatekit_lite.sh

  lite-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell updater without executing it
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path (Get-Location) 'updatekit_lite.ps1'),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }
          Write-Host '[PASS] Lite PowerShell parser'
      - name: Exercise real Git argv forwarding in Windows PowerShell 5.1
        shell: powershell
        run: .\updatekit_lite.ps1 -SelfTest
      - name: Verify Docker volume-bind mount parsing and guards on Windows PowerShell 5.1
        shell: powershell
        run: .\updatekit_lite.ps1 -MountSelfTest
      - name: Exercise Lite full control flow with simulated Docker (Windows PowerShell 5.1)
        shell: powershell
        run: .\scripts\test_lite_wrapper.ps1
