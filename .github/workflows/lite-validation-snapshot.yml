name: Lite source validation snapshot
on:
  push:
    branches: ["refactor/lite-only-runtime"]
    paths: [".github/workflows/lite-validation-snapshot.yml"]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive only tracked source at the tested commit
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/devkit-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: lite-validation-source
          path: ${{ runner.temp }}/devkit-source.tar
          retention-days: 1
          if-no-files-found: error
