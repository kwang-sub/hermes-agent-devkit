# Hermes Managed Project의 안정적인 Resolver Metadata 예시.

project:
  id: server
  name: server
  repository: /workspace/server

resolver:
  aliases:
    - wowsoft-server
    - backend-server

  modules:
    - scApi
    - XCommServer
    - XApprovalPushAPI
    - XAgentStatus

  files:
    - application.properties

  paths:
    - scApi
    - XCommServer

# Source Mapping은 보조 Context로만 사용한다.
# Jira Project Key만으로는 Repository를 Resolve할 수 없다.
work_sources:
  jira:
    project_keys:
      - DSB

    components:
      - Backend

    labels:
      - backend
