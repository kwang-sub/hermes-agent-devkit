name: Naming refactor workbench
on:
  push:
    branches: ['refactor/devkit-neutral-names']
    paths: ['.github/workflows/naming-refactor-workbench.yml', 'scripts/prepare_naming_refactor.py']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install PyYAML
      - name: Prepare the exact locally reviewed candidate
        run: |
          cp scripts/prepare_naming_refactor.py "$RUNNER_TEMP/prepare_naming_refactor.py"
          python "$RUNNER_TEMP/prepare_naming_refactor.py" prepare
      - name: Verify all candidate contracts and regression suites
        env:
          DEVKIT_TEST_REPORT: ${{ runner.temp }}/naming-regression-results.json
        run: |
          set -o pipefail
          bash scripts/verify.sh 2>&1 | tee "$RUNNER_TEMP/naming-regression.log"
      - name: Publish verified tree object without updating any ref
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python "$RUNNER_TEMP/prepare_naming_refactor.py" publish-tree
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devkit-naming-candidate
          path: |
            ${{ runner.temp }}/naming-candidate.json
            ${{ runner.temp }}/naming-candidate.patch
            ${{ runner.temp }}/naming-regression-results.json
            ${{ runner.temp }}/naming-regression.log
          retention-days: 3
