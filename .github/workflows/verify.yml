name: Verify DevKit

on:
  push:
    branches:
      - dev
      - "fix/**"
      - "feat/**"
      - "feature/**"
      - "perf/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify repository contracts
        shell: bash
        run: bash scripts/verify.sh

      - name: Verify Java official-practice capability contract
        shell: bash
        run: python3 scripts/check_java_capability_contract.py

      - name: Verify Spring official-practice capability contract
        shell: bash
        run: python3 scripts/check_spring_capability_contract.py

      - name: Verify Kotlin first-class capability contract
        shell: bash
        run: python3 scripts/check_kotlin_capability_contract.py

      - name: Verify Codex Kanban worker context runtime
        shell: bash
        run: python3 scripts/devkit_kanban_worker_context.py --self-test

      - name: Verify Codex Hermes MCP worker context patch
        shell: bash
        run: python3 scripts/patch_hermes_codex_kanban_context.py --self-test

      - name: Verify non-Codex worker context gate
        shell: bash
        run: python3 custom-skills/coder/dev-implement-plan/tests/test_verify_worker_context.py

      - name: Verify frontend capability contract
        shell: bash
        run: python3 scripts/check_frontend_capability_contract.py

      - name: Verify stack capability detector
        shell: bash
        run: python3 custom-skills/orchestrator/dev-tech-dispatch/tests/test_detect_capabilities.py

      - name: Verify bootstrap technology cache
        shell: bash
        run: python3 custom-skills/orchestrator/dev-project-bootstrap/tests/test_stack_cache.py

      - name: Verify bootstrap stack refresh discovery
        shell: bash
        run: python3 custom-skills/orchestrator/dev-project-bootstrap/tests/test_refresh_stacks.py

      - name: Verify Figma read-only adapter
        shell: bash
        run: python3 custom-skills/shared/dev-figma-design/tests/test_figma_context.py

      - name: Verify Flow model policy
        shell: bash
        run: python3 shared/scripts/test_flow_model_policy.py

      - name: Verify Kanban notification helper
        shell: bash
        run: python3 custom-skills/orchestrator/dev-workspace-dispatch/tests/test_subscribe_notification.py

      - name: Verify Kanban registration event helper
        shell: bash
        run: python3 shared/scripts/test_kanban_registration_event.py

      - name: Verify Discord Kanban notification patch
        shell: bash
        run: python3 scripts/patch_hermes_discord_kanban_notify.py --self-test

      - name: Verify runtime validation contracts
        shell: bash
        run: python3 scripts/test_verification_runtime_contract.py

      - name: Verify Gradle bounded verification helper
        shell: bash
        run: python3 custom-skills/coder/dev-implement-plan/tests/test_gradle_verification.py

      - name: Verify Gradle verification evidence reuse
        shell: bash
        run: python3 custom-skills/coder/dev-implement-plan/tests/test_gradle_verification_cached.py

      - name: Verify hermes-java Gradle cache fallback
        shell: bash
        run: python3 scripts/test_hermes_java.py

      - name: Verify DevKit updater contract
        shell: bash
        run: python3 scripts/check_update_devkit_contract.py

      - name: Validate DevKit updater PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "update-devkit.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { [Console]::Error.WriteLine($_.Message) }
            exit 1
          }
