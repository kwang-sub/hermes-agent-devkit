name: Verify Git PR Publish Skill

on:
  push:
    branches:
      - dev
      - "fix/**"
      - "feat/**"
      - "feature/**"
      - "refactor/**"
      - "perf/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify-pr-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Git PR publish regression tests
        shell: bash
        run: python3 custom-skills/orchestrator/git-pr-publish/tests/test_pr_publish.py

      - name: Verify custom skill contract
        shell: bash
        run: python3 scripts/check_skill_contract.py

      - name: Verify update-devkit contract remains compatible
        shell: bash
        run: python3 scripts/check_update_devkit_contract.py

      - name: Verify Git publish bootstrap contract
        shell: bash
        run: python3 scripts/check_git_publish_bootstrap_contract.py
