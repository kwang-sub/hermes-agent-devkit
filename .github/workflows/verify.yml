name: Verify DevKit
on:
  push:
    branches: [dev, 'fix/**', 'feat/**', 'feature/**', 'refactor/**', 'perf/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install PyYAML
      - name: All active contracts and retained regression suites
        env:
          DEVKIT_TEST_REPORT: ${{ runner.temp }}/devkit-regression-results.json
        run: bash scripts/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lite-regression-results
          path: ${{ runner.temp }}/devkit-regression-results.json
          if-no-files-found: warn
  windows-updater:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Parse all PowerShell scripts on Windows PowerShell 5.1
        shell: powershell
        run: |
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { $errors | Write-Error; exit 1 }
          }
      - name: Mount preservation and actual updater orchestration fixtures
        shell: powershell
        run: |
          .\scripts\test_devkit_mounts.ps1
          .\scripts\test_update_devkit.ps1
