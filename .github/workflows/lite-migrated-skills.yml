name: Lite migrated skill regression
on:
  push:
    branches: [dev, "refactor/**", "feat/**", "fix/**"]
    paths:
      - "custom-skills/lite/**"
      - "scripts/verification/**"
      - ".github/workflows/lite-migrated-skills.yml"
  pull_request:
    paths:
      - "custom-skills/lite/**"
      - "scripts/verification/**"
      - ".github/workflows/lite-migrated-skills.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrated-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Skill metadata and Python syntax
        run: |
          python3 scripts/check_skill_contract.py
          python3 -m compileall -q custom-skills/lite scripts/verification
      - name: Lite Git PR publish tests
        run: python3 custom-skills/lite/git-pr-publish/tests/test_pr_publish.py
      - name: Lite feature docs tests
        run: python3 custom-skills/lite/dev-feature-docs/tests/test_find_feature_docs.py
      - name: Verify Lite-only toolchain helper import paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('scripts/verification')
          for name in ('maven_verification','gradle_verification'):
              engine=(root/(name+'.py')).read_text(encoding='utf-8')
              cache=(root/(name+'_cached.py')).read_text(encoding='utf-8')
              assert "_PROJECT_ROOT = Path(__file__).resolve().parents[2]" in engine
              assert "'custom-skills' / '_lib'" in engine
              assert 'with_name("' + name + '.py")' in cache
          assert "repo = Path(__file__).resolve().parents[2]" in (root/'maven_verification_cached.py').read_text(encoding='utf-8')
          PY
