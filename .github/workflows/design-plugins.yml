name: Design Plugins Initial Integration
on:
  push:
    branches: [dev, 'fix/**', 'feat/**', 'feature/**']
    paths:
      - 'compose.yml'
      - 'scripts/design*'
      - 'scripts/test_design_plugins*'
      - 'shared/design-plugins/**'
      - '.github/workflows/design-plugins.yml'
  pull_request:
    paths:
      - 'compose.yml'
      - 'scripts/design*'
      - 'scripts/test_design_plugins*'
      - 'shared/design-plugins/**'
      - '.github/workflows/design-plugins.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install PyYAML
      - name: Offline installation and local-only contracts
        run: python scripts/test_design_plugins.py
      - name: Compile helpers
        run: python -m py_compile scripts/design_plugins.py scripts/test_design_plugins.py
  windows-wrapper:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Windows PowerShell 5.1 path mapping and port guards
        shell: powershell
        run: .\scripts\test_design_plugins.ps1
