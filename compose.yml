name: ${HERMES_COMPOSE_PROJECT_NAME:-hermes-dev}

services:
  hermes:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HERMES_BASE_IMAGE: ${HERMES_BASE_IMAGE:-nousresearch/hermes-agent:v2026.8.16.2}

    image: ${HERMES_IMAGE_NAME:-hermes-dev}:${HERMES_IMAGE_TAG:-0.1.0}
    container_name: ${HERMES_CONTAINER_NAME:-hermes-dev}

    restart: unless-stopped

    # Hermes 공식 이미지의 s6-overlay /init과 root bootstrap을 유지하기 위해
    # init: true, user: hermes, cap_drop: ALL, no-new-privileges는 지정하지 않는다.
    # 대화형 CLI는 컨테이너 시작 사용자를 바꾸지 말고 `docker exec --user hermes`로 실행한다.

    working_dir: ${HERMES_CONTAINER_WORKSPACE_PATH:-/workspace}

    volumes:
      - type: bind
        source: ${HERMES_HOST_WORKSPACE_PATH:-D:/workspace}
        target: ${HERMES_CONTAINER_WORKSPACE_PATH:-/workspace}

      # Hermes running in Docker Desktop on WSL may normalize Windows paths to
      # /mnt/<drive>/... before file/vision tools run. update-devkit.ps1 derives
      # the exact target from LOCALAPPDATA and passes it through the process env.
      # USERNAME is only a first-update compatibility fallback while the updater
      # script itself is being fast-forwarded to a version that sets the target.
      - type: bind
        source: ${LOCALAPPDATA}/Temp
        target: ${HERMES_WINDOWS_TEMP_CONTAINER_PATH:-/mnt/c/Users/${USERNAME}/AppData/Local/Temp}
        read_only: true

      - type: volume
        source: hermes-data
        target: /opt/data

      # 역할별 Skill과 공통 Skill은 하나의 read-only custom-skills root에서 관리한다.
      # 각 Profile의 skills.external_dirs가 자신의 역할 디렉터리와 shared를 함께 참조한다.
      - type: bind
        source: ${HERMES_HOST_CUSTOM_SKILLS_PATH:-./custom-skills}
        target: ${HERMES_CONTAINER_CUSTOM_SKILLS_PATH:-/opt/custom-skills}
        read_only: true

      - type: bind
        source: ${HERMES_HOST_SHARED_PATH:-./shared}
        target: ${HERMES_CONTAINER_SHARED_PATH:-/opt/data/shared}
        read_only: true

    environment:
      TZ: ${HERMES_TIMEZONE:-Asia/Seoul}

      # Host/Container workspace bind mapping. Agent/skill path resolution must
      # use this mapping before applying any /mnt/<drive> Temp-path convention.
      HERMES_HOST_WORKSPACE_PATH: ${HERMES_HOST_WORKSPACE_PATH:-D:/workspace}
      HERMES_CONTAINER_WORKSPACE_PATH: ${HERMES_CONTAINER_WORKSPACE_PATH:-/workspace}

      # File tools may write only inside explicit development/persistent roots.
      # Multiple roots are separated with ':' on the Linux container.
      HERMES_WRITE_SAFE_ROOT: ${HERMES_WRITE_SAFE_ROOT:-/workspace:/opt/data}

      # Dashboard is part of the baseline DevKit runtime. Keep it enabled so the
      # healthcheck has a deterministic listener contract.
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: ${HERMES_DASHBOARD_HOST:-0.0.0.0}
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_USERNAME:?Set HERMES_DASHBOARD_USERNAME in .env}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_PASSWORD:?Set HERMES_DASHBOARD_PASSWORD in .env}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_SECRET:?Set HERMES_DASHBOARD_SECRET in .env}
      HERMES_DASHBOARD_PORT: ${HERMES_DASHBOARD_CONTAINER_PORT:-9119}

      # Optional OpenAI-compatible API server. Disabled by default.
      API_SERVER_ENABLED: ${HERMES_API_SERVER_ENABLED:-false}
      API_SERVER_HOST: ${HERMES_API_SERVER_HOST:-0.0.0.0}
      API_SERVER_PORT: ${HERMES_API_SERVER_CONTAINER_PORT:-8642}
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY:-}

      # Jira Cloud
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_API_VERSION: ${JIRA_API_VERSION:-3}
      JIRA_ACCEPTANCE_CRITERIA_FIELDS: ${JIRA_ACCEPTANCE_CRITERIA_FIELDS:-Acceptance Criteria}
      JIRA_INCLUDE_FIELD_NAMES: ${JIRA_INCLUDE_FIELD_NAMES:-}
      JIRA_VERIFY_SSL: ${JIRA_VERIFY_SSL:-true}

      # Optional Kanban terminal-event notifications. Platform switching is env-only.
      HERMES_KANBAN_NOTIFY_ENABLED: ${HERMES_KANBAN_NOTIFY_ENABLED:-false}
      HERMES_KANBAN_NOTIFY_PLATFORM: ${HERMES_KANBAN_NOTIFY_PLATFORM:-discord}
      HERMES_KANBAN_NOTIFY_TARGET: ${HERMES_KANBAN_NOTIFY_TARGET:-}
      HERMES_KANBAN_NOTIFY_DELIVERY_MODE: ${HERMES_KANBAN_NOTIFY_DELIVERY_MODE:-notify}
      HERMES_KANBAN_NOTIFY_CHAT_TYPE: ${HERMES_KANBAN_NOTIFY_CHAT_TYPE:-channel}

      # Discord gateway credentials. Keep the token only in local .env.
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_HOME_CHANNEL: ${HERMES_KANBAN_NOTIFY_TARGET:-}

      HERMES_WORK_ITEM_DIR: ${HERMES_WORK_ITEM_DIR:-/opt/data/work-items}

    ports:
      - "${HERMES_PORT_BIND_ADDRESS:-127.0.0.1}:${HERMES_DASHBOARD_HOST_PORT:-9119}:${HERMES_DASHBOARD_CONTAINER_PORT:-9119}"
      - "${HERMES_PORT_BIND_ADDRESS:-127.0.0.1}:${HERMES_API_SERVER_HOST_PORT:-8642}:${HERMES_API_SERVER_CONTAINER_PORT:-8642}"

    stdin_open: true
    tty: true

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/hermes/.venv/bin/python -c "import socket; s=socket.create_connection(('127.0.0.1', ${HERMES_DASHBOARD_CONTAINER_PORT:-9119}), timeout=5); s.close()" || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    command:
      - gateway
      - run

volumes:
  hermes-data:
    name: ${HERMES_DATA_VOLUME_NAME:-hermes-dev-data}
