name: Lite default profile migration
on:
  push:
    branches: ["refactor/**", dev]
    paths:
      - "scripts/lite_default_profile.py"
      - "init-lite.ps1"
      - "update-devkit.ps1"
      - "compose.yml"
      - "scripts/verify-container-runtime.ps1"
      - "scripts/check_update_devkit_contract.py"
      - "scripts/check_env_contract.py"
      - "scripts/test_lite_default_profile.py"
      - ".github/workflows/lite-profile-migration.yml"
  pull_request:
    paths:
      - "scripts/lite_default_profile.py"
      - "scripts/test_lite_default_profile.py"
      - ".github/workflows/lite-profile-migration.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML
      - name: Idempotence, archive and active-worker guard regression
        run: python scripts/test_lite_default_profile.py
      - name: Updater / Environment static contracts
        run: |
          python scripts/check_update_devkit_contract.py
          python scripts/check_env_contract.py

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell 5.1 updater and Lite initializer
        shell: powershell
        run: |
          foreach ($file in @("update-devkit.ps1", "init-lite.ps1", "scripts/verify-container-runtime.ps1")) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "$file : $($_.Message)" }
              exit 1
            }
          }
