name: Verify Latest Hermes Compatibility

on:
  push:
    branches:
      - dev
      - "fix/**"
      - "feat/**"
      - "feature/**"
      - "perf/**"
      - "refactor/**"
  pull_request:

permissions:
  contents: read

jobs:
  latest-hermes-compat:
    name: latest Hermes update-devkit compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Hermes TUI startup patch contract
        shell: bash
        run: python3 scripts/check_hermes_tui_startup_contract.py

      - name: Verify latest Hermes upstream patch compatibility
        shell: bash
        run: |
          set +e
          set -o pipefail
          HERMES_BASE_IMAGE=nousresearch/hermes-agent:latest bash scripts/verify_latest_hermes_compat.sh > "$RUNNER_TEMP/hermes-compat.log" 2>&1
          result=$?
          tail -n 160 "$RUNNER_TEMP/hermes-compat.log"
          exit "$result"
      - name: Preserve full image validation evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hermes-image-validation-log
          path: ${{ runner.temp }}/hermes-compat.log
          if-no-files-found: warn
          retention-days: 7
