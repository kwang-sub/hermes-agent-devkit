name: Reference sample contracts
on:
  push:
    branches: [dev, 'feat/**', 'fix/**', 'refactor/**']
    paths: ['shared/references/samples/**', 'custom-skills/shared/dev-spring-*/**', 'custom-skills/shared/dev-api-docs/**', 'scripts/test_reference_samples.py', '.github/workflows/reference-samples.yml']
  pull_request:
    paths: ['shared/references/samples/**', 'custom-skills/shared/dev-spring-*/**', 'custom-skills/shared/dev-api-docs/**', 'scripts/test_reference_samples.py', '.github/workflows/reference-samples.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kotlin-spring:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and test isolated Kotlin reference module
        run: >-
          mvn --batch-mode --no-transfer-progress
          -f shared/references/samples/spring/kotlin/pom.xml
          -Dmaven.repo.local=${{ runner.temp }}/sample-m2
          -Dsample.build.directory=${{ runner.temp }}/sample-target
          verify
      - name: Preserve actual sample test and OpenAPI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-sample-evidence
          path: |
            ${{ runner.temp }}/sample-target/surefire-reports/
            ${{ runner.temp }}/sample-target/generated-openapi.json
          if-no-files-found: warn
